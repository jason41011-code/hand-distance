<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI 手部距離偵測 (帶校正功能)</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 15px; }
        h1 { font-size: 1.3rem; margin: 10px 0 5px 0; color: #00ffcc; }
        .canvas-container { position: relative; width: 100%; max-width: 480px; margin: 10px auto; }
        video { display: none; }
        canvas { width: 100%; height: auto; border: 2px solid #00ffcc; border-radius: 12px; background: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #status { font-size: 0.9rem; color: #ffcc00; margin: 5px 0; padding: 8px; background: rgba(255,255,255,0.08); border-radius: 6px; }
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .btn { background: #00ffcc; color: #121212; border: none; padding: 12px 20px; font-size: 0.95rem; font-weight: bold; border-radius: 25px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,255,204,0.3); -webkit-tap-highlight-color: transparent; }
        .btn-calibrate { background: #ffcc00; box-shadow: 0 2px 8px rgba(255,204,0,0.3); }
        .btn:active { opacity: 0.8; }
        .hint { font-size: 0.85rem; color: #aaa; margin-top: 10px; line-height: 1.4; }
    </style>
</head>
<body>

    <h1>AI 手部距離偵測</h1>
    <div id="status">正在初始化 AI 模型...</div>

    <div class="canvas-container">
        <video id="videoInput" playsinline muted></video>
        <canvas id="canvasOutput"></canvas>
    </div>

    <div class="btn-group">
        <button class="btn btn-calibrate" id="calibrateBtn">🎯 30cm 快速校正</button>
        <button class="btn" id="switchBtn">切換鏡頭</button>
    </div>

    <div class="hint">
        💡 **校正教學**：將手掌放在距離鏡頭 **30 公分** 處，點擊「30cm 快速校正」即可完成鏡頭精準校正。
    </div>

    <script>
        const video = document.getElementById('videoInput');
        const canvas = document.getElementById('canvasOutput');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        const switchBtn = document.getElementById('switchBtn');
        const calibrateBtn = document.getElementById('calibrateBtn');

        let useFacingMode = "user";
        let cameraHelper = null;
        let smoothDistance = 0;
        let currentPixelDist = 0; // 紀錄當前手掌像素大小

        // 預設參數
        const KNOWN_PALM_WIDTH = 7.5; // 食指根部到小指根部 (cm)
        let focalLength = localStorage.getItem('calibratedFocalLength') 
            ? parseFloat(localStorage.getItem('calibratedFocalLength')) 
            : 550; // 若有校正紀錄則優先讀取

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        function startCamera() {
            if (cameraHelper) cameraHelper.stop();
            statusText.innerText = "正在開啟鏡頭...";

            cameraHelper = new Camera(video, {
                onFrame: async () => { await hands.send({ image: video }); },
                facingMode: useFacingMode,
                width: 720,
                height: 1280
            });

            cameraHelper.start().then(() => {
                statusText.innerText = "系統運作中，請將手掌面對鏡頭";
            }).catch(err => {
                statusText.innerText = "無法開啟鏡頭，請確認存取權限。";
            });
        }

        function onResults(results) {
            canvas.width = video.videoWidth || 720;
            canvas.height = video.videoHeight || 1280;

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (useFacingMode === "user") {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                const p5 = landmarks[5];   // 食指根部
                const p17 = landmarks[17]; // 小指根部

                const x1 = p5.x * canvas.width;
                const y1 = p5.y * canvas.height;
                const x2 = p17.x * canvas.width;
                const y2 = p17.y * canvas.height;

                // 即時像素距離
                currentPixelDist = Math.hypot(x2 - x1, y2 - y1);

                // 計算物理距離
                const rawDistance = (KNOWN_PALM_WIDTH * focalLength) / currentPixelDist;

                // 平滑濾波
                if (smoothDistance === 0) smoothDistance = rawDistance;
                smoothDistance = smoothDistance * 0.7 + rawDistance * 0.3;

                // 畫出測量線與骨骼點
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
                ctx.stroke();

                for (let lm of landmarks) {
                    ctx.fillStyle = '#ff0055';
                    ctx.beginPath();
                    ctx.arc(lm.x * canvas.width, lm.y * canvas.height, 4, 0, 2 * Math.PI);
                    ctx.fill();
                }

                if (useFacingMode === "user") {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }

                const textX = (useFacingMode === "user") ? (canvas.width - x1) : x1;
                ctx.fillStyle = '#00ffcc';
                ctx.font = 'bold 28px sans-serif';
                ctx.fillText(`${Math.round(smoothDistance)} cm`, textX, Math.max(y1 - 20, 40));

                statusText.innerText = `距離：${Math.round(smoothDistance)} cm`;
            } else {
                currentPixelDist = 0;
                smoothDistance = 0;
                statusText.innerText = "搜尋手掌中...";
            }

            ctx.restore();
        }

        // 30cm 校正按鈕邏輯
        calibrateBtn.addEventListener('click', () => {
            if (currentPixelDist > 0) {
                // 自動反推此鏡頭焦距參數 (以 30cm 為基準)
                focalLength = (currentPixelDist * 30.0) / KNOWN_PALM_WIDTH;
                
                // 儲存在手機瀏覽器快取中，下次打開不用重新校正
                localStorage.setItem('calibratedFocalLength', focalLength);
                
                alert(`校正成功！焦距參數已設定為：${Math.round(focalLength)}`);
            } else {
                alert("未偵測到手掌，請先將手掌面對鏡頭！");
            }
        });

        switchBtn.addEventListener('click', () => {
            useFacingMode = (useFacingMode === "user") ? "environment" : "user";
            startCamera();
        });

        startCamera();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI 手部距離偵測 (POCO/Xiaomi 專用版)</title>
    <!-- 使用廣泛相容之 MediaPipe 核心 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469242/hands.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 15px; }
        h1 { font-size: 1.3rem; margin: 10px 0 5px 0; color: #00ffcc; }
        .canvas-container { position: relative; width: 100%; max-width: 480px; margin: 10px auto; }
        
        /* POCO/HyperOS 專用修正：離屏渲染，避免 GPU 將視訊元素優化裁剪掉 */
        video { position: fixed; top: 0; left: -9999px; width: 640px; height: 480px; opacity: 0; pointer-events: none; }
        
        canvas { width: 100%; height: auto; border: 2px solid #00ffcc; border-radius: 12px; background: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        #status { font-size: 0.95rem; font-weight: bold; color: #ffcc00; margin: 5px 0; padding: 10px; background: rgba(255,204,0,0.15); border: 1px solid #ffcc00; border-radius: 8px; word-break: break-all; }
        #status.ready { color: #00ffcc; background: rgba(0,255,204,0.1); border-color: #00ffcc; }

        .btn-group { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .btn { background: #00ffcc; color: #121212; border: none; padding: 12px 20px; font-size: 1rem; font-weight: bold; border-radius: 25px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,255,204,0.3); -webkit-tap-highlight-color: transparent; }
        .btn-calibrate { background: #ffcc00; box-shadow: 0 2px 8px rgba(255,204,0,0.4); animation: pulse 1.5s infinite; }
        .btn:active { opacity: 0.8; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .hint { font-size: 0.85rem; color: #aaa; margin-top: 10px; line-height: 1.4; }
        #debugLog { font-family: monospace; font-size: 0.75rem; color: #888; text-align: left; background: #000; padding: 8px; border-radius: 6px; margin-top: 15px; max-height: 100px; overflow-y: auto; }
    </style>
</head>
<body>

    <h1>AI 手部距離偵測</h1>
    <div id="status">⏳ 正在啟動引擎...</div>

    <div class="canvas-container">
        <!-- 實體寬高屬性防止 Android 視訊解碼停止 -->
        <video id="videoInput" width="640" height="480" playsinline muted webkit-playsinline></video>
        <canvas id="canvasOutput"></canvas>
    </div>

    <div class="btn-group">
        <button class="btn btn-calibrate" id="calibrateBtn">🎯 確認 15cm 校正</button>
        <button class="btn" id="switchBtn">切換鏡頭</button>
    </div>

    <div class="hint" id="hintText">
        💡 <b>校正指南</b>：將手掌固定在距離鏡頭 <b>15 公分</b> 處，看到紅點後按下「確認 15cm 校正」。
    </div>

    <div id="debugLog">[System] 初始化中...</div>

    <script>
        const video = document.getElementById('videoInput');
        const canvas = document.getElementById('canvasOutput');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        const switchBtn = document.getElementById('switchBtn');
        const calibrateBtn = document.getElementById('calibrateBtn');
        const hintText = document.getElementById('hintText');
        const debugLog = document.getElementById('debugLog');

        function log(msg) {
            console.log(msg);
            debugLog.innerText = `[${new Date().toLocaleTimeString()}] ${msg}\n` + debugLog.innerText;
        }

        let currentStream = null;
        let useFacingMode = "user";
        let isModelReady = false;
        let isProcessing = false;
        let animationFrameId = null;

        let isCalibrated = false;
        const CALIBRATE_TARGET_CM = 15.0;
        const KNOWN_PALM_WIDTH = 7.5;
        let focalLength = 500;
        
        let currentPixelDist = 0;
        let smoothDistance = 0;

        // 初始化 MediaPipe Hands
        log("開始載入 MediaPipe 檔...");
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469242/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0, // 使用 Lite 模型，提升 Android 裝置相容度與 FPS
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        hands.initialize().then(() => {
            isModelReady = true;
            log("AI 模型加載完成！");
            statusText.innerText = "⚠️ 請先進行校正：將手固定放置於 15 公分處";
            startCamera();
        }).catch(err => {
            log("模型錯誤: " + err.message);
            statusText.innerText = "❌ AI 模型載入失敗，請重新整理網頁";
        });

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            log(`開啟鏡頭: ${useFacingMode}`);

            try {
                const constraints = {
                    video: {
                        facingMode: useFacingMode,
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });

                log(`相機解析度: ${video.videoWidth}x${video.videoHeight}`);

                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                processFrame();

            } catch (err) {
                log("鏡頭存取失敗: " + err.name);
                statusText.innerText = "❌ 無法存取鏡頭，請確認權限設定。";
            }
        }

        async function processFrame() {
            // 安全防禦：確保相機已有真實尺寸且 Ready 狀態
            if (video.readyState >= 2 && video.videoWidth > 0 && isModelReady && !isProcessing) {
                isProcessing = true;
                try {
                    await hands.send({ image: video });
                } catch (e) {
                    log("處理影格例外: " + e.message);
                }
                isProcessing = false;
            }
            animationFrameId = requestAnimationFrame(processFrame);
        }

        function onResults(results) {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (useFacingMode === "user") {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                const p5 = landmarks[5];   // 食指根部
                const p17 = landmarks[17]; // 小指根部

                const x1 = p5.x * canvas.width;
                const y1 = p5.y * canvas.height;
                const x2 = p17.x * canvas.width;
                const y2 = p17.y * canvas.height;

                currentPixelDist = Math.hypot(x2 - x1, y2 - y1);

                ctx.strokeStyle = isCalibrated ? '#00ffcc' : '#ffcc00';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
                ctx.stroke();

                for (let lm of landmarks) {
                    ctx.fillStyle = '#ff0055';
                    ctx.beginPath();
                    ctx.arc(lm.x * canvas.width, lm.y * canvas.height, 4, 0, 2 * Math.PI);
                    ctx.fill();
                }

                if (useFacingMode === "user") {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }

                const textX = (useFacingMode === "user") ? (canvas.width - x1) : x1;

                if (!isCalibrated) {
                    ctx.fillStyle = '#ffcc00';
                    ctx.font = 'bold 24px sans-serif';
                    ctx.fillText("請維持 15cm 並按校正", textX, Math.max(y1 - 20, 40));
                } else {
                    const rawDistance = (KNOWN_PALM_WIDTH * focalLength) / currentPixelDist;

                    if (smoothDistance === 0) smoothDistance = rawDistance;
                    smoothDistance = smoothDistance * 0.7 + rawDistance * 0.3;

                    ctx.fillStyle = '#00ffcc';
                    ctx.font = 'bold 32px sans-serif';
                    ctx.fillText(`${Math.round(smoothDistance)} cm`, textX, Math.max(y1 - 20, 40));

                    statusText.innerText = `🟢 實時測距中：${Math.round(smoothDistance)} cm`;
                }

            } else {
                currentPixelDist = 0;
                smoothDistance = 0;
                if (!isCalibrated) {
                    statusText.innerText = "⚠️ 搜尋手掌中...請保持手掌面向鏡頭";
                } else {
                    statusText.innerText = "🔍 搜尋手掌中...";
                }
            }

            ctx.restore();
        }

        calibrateBtn.addEventListener('click', () => {
            if (currentPixelDist > 0) {
                focalLength = (currentPixelDist * CALIBRATE_TARGET_CM) / KNOWN_PALM_WIDTH;
                isCalibrated = true;

                statusText.className = "ready";
                statusText.innerText = "✅ 校正完成！開始實時測距";
                
                calibrateBtn.classList.remove("btn-calibrate");
                calibrateBtn.style.animation = "none";
                calibrateBtn.innerText = "🔄 重新校正 (15cm)";

                hintText.innerHTML = "💡 <b>測距進行中</b>：可隨意移動手掌。";

            } else {
                alert("未偵測到手掌！請確定畫面上看到手部紅點後再按確認。");
            }
        });

        switchBtn.addEventListener('click', () => {
            useFacingMode = (useFacingMode === "user") ? "environment" : "user";
            isCalibrated = false;
            
            statusText.className = "";
            statusText.innerText = "⚠️ 切換鏡頭，請重新進行 15cm 校正";
            calibrateBtn.classList.add("btn-calibrate");
            calibrateBtn.innerText = "🎯 確認 15cm 校正";
            
            startCamera();
        });
    </script>
</body>
</html>
